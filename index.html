<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HYPER CLOUD — 스크롤로 날아가는 세계</title>
<meta name="description" content="스크롤 한 번으로 HYPER Cloud의 세계를 비행합니다." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sw-bg:#131026;
    --sw-bg2:#241d4e;
    --sw-ink:#f4f1ff;
    --sw-ink-soft:#b7aed6;
    --sw-accent:#ffb84d;
    --sw-font-display:'Black Han Sans', sans-serif;
    --sw-font-body:'IBM Plex Sans KR', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:auto}
  body{
    background:var(--sw-bg);
    color:var(--sw-ink);
    font-family:var(--sw-font-body);
    overflow-x:hidden;
  }
  /* scroll runway — height drives the flight */
  #runway{width:100%;}

  #stage{
    position:fixed; inset:0; z-index:0;
    background:radial-gradient(120% 90% at 50% 10%, var(--sw-bg2) 0%, var(--sw-bg) 70%);
  }
  #stage canvas{display:block;width:100%;height:100%}

  /* ── header ─────────────────────────── */
  header{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 28px 14px;
  }
  .brand{
    font-family:var(--sw-font-display);
    font-size:20px; letter-spacing:.08em; text-decoration:none; color:var(--sw-ink);
    text-shadow:0 2px 18px rgba(0,0,0,.5);
  }
  .brand em{font-style:normal;color:var(--sw-accent);transition:color .5s}
  .head-cta{
    font-size:13px; font-weight:500; text-decoration:none; color:var(--sw-ink);
    border:1px solid rgba(244,241,255,.35); border-radius:99px; padding:8px 16px;
    backdrop-filter:blur(6px); background:rgba(19,16,38,.35);
    transition:border-color .3s, background .3s;
  }
  .head-cta:hover{border-color:var(--sw-accent); background:rgba(19,16,38,.7)}

  /* ── copy blocks ────────────────────── */
  .copy{
    position:fixed; z-index:10;
    left:clamp(20px, 6vw, 90px);
    bottom:calc(clamp(56px, 12dvh, 130px) + env(safe-area-inset-bottom));
    max-width:min(520px, 84vw);
    opacity:0; transform:translateY(18px);
    pointer-events:none;
    transition:none;
  }
  .copy.on{pointer-events:auto}
  .eyebrow{
    font-size:12px; font-weight:700; letter-spacing:.28em; text-transform:uppercase;
    color:var(--acc,#ffb84d); margin-bottom:12px;
  }
  .copy h2{
    font-family:var(--sw-font-display);
    font-size:clamp(30px, 5.2vw, 56px);
    line-height:1.12; font-weight:400;
    text-shadow:0 4px 30px rgba(10,8,24,.75);
    margin-bottom:14px;
  }
  .copy p{
    font-size:clamp(14px, 1.6vw, 16.5px); line-height:1.75; font-weight:300;
    color:var(--sw-ink-soft);
    text-shadow:0 2px 14px rgba(10,8,24,.8);
    max-width:44ch;
  }
  .tags{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px}
  .tags span{
    font-size:11.5px; font-weight:500; letter-spacing:.04em;
    padding:5px 12px; border-radius:99px;
    color:var(--sw-ink);
    border:1px solid color-mix(in srgb, var(--acc,#ffb84d) 55%, transparent);
    background:color-mix(in srgb, var(--acc,#ffb84d) 14%, rgba(19,16,38,.4));
    backdrop-filter:blur(4px);
  }
  .cta-row{display:flex; gap:12px; margin-top:24px; flex-wrap:wrap}
  .btn{
    font-family:var(--sw-font-body); font-size:14px; font-weight:700;
    text-decoration:none; border-radius:12px; padding:13px 24px;
    transition:transform .2s, box-shadow .2s;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn.primary{
    color:#1c1533; background:var(--acc,#ffd166);
    box-shadow:0 6px 28px color-mix(in srgb, var(--acc,#ffd166) 40%, transparent);
  }
  .btn.ghost{
    color:var(--sw-ink); border:1px solid rgba(244,241,255,.4);
    background:rgba(19,16,38,.35); backdrop-filter:blur(6px);
  }

  /* ── scroll hint ────────────────────── */
  #hint{
    position:fixed; z-index:10; left:50%; transform:translateX(-50%);
    bottom:calc(18px + env(safe-area-inset-bottom));
    font-size:12px; letter-spacing:.24em; color:var(--sw-ink-soft);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    transition:opacity .5s;
  }
  #hint .line{width:1px; height:34px; background:linear-gradient(var(--sw-ink-soft), transparent); animation:drop 1.6s ease-in-out infinite}
  @keyframes drop{0%{transform:scaleY(0);transform-origin:top}55%{transform:scaleY(1);transform-origin:top}56%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

  /* ── route rail ─────────────────────── */
  #rail{
    position:fixed; z-index:20; right:clamp(14px, 3vw, 34px); top:50%;
    transform:translateY(-50%);
    display:flex; flex-direction:column; align-items:flex-end; gap:20px;
  }
  #rail button{
    display:flex; align-items:center; gap:10px;
    background:none; border:none; cursor:pointer; padding:2px;
    color:var(--sw-ink-soft); font-family:var(--sw-font-body); font-size:11px; letter-spacing:.08em;
  }
  #rail .lbl{opacity:0; transform:translateX(6px); transition:opacity .3s, transform .3s}
  #rail button:hover .lbl, #rail button.active .lbl{opacity:1; transform:none}
  #rail .dot{
    width:9px; height:9px; border-radius:50%;
    border:1.5px solid var(--sw-ink-soft); background:transparent;
    transition:background .3s, border-color .3s, transform .3s;
  }
  #rail button.active .dot{
    background:var(--acc,#ffb84d); border-color:var(--acc,#ffb84d); transform:scale(1.35);
  }
  #rail button.active{color:var(--sw-ink)}

  @media (max-width:640px){
    header{padding-left:18px;padding-right:18px}
    .copy{left:18px; right:18px; max-width:none}
    #rail .lbl{display:none}
    #rail{gap:16px}
  }

  /* ── reduced motion: flat article fallback ── */
  @media (prefers-reduced-motion: reduce){
    #stage, #hint, #rail{display:none}
    body{overflow:auto}
    .copy{
      position:static; opacity:1 !important; transform:none !important;
      max-width:620px; margin:12vh auto; padding:0 24px; pointer-events:auto;
    }
    #runway{height:auto !important}
  }
</style>
</head>
<body>

<header>
  <a class="brand" href="#top" id="top">HYPER<em>·</em>CLOUD</a>
  <a class="head-cta" href="#contact">프로젝트 문의</a>
</header>

<div id="stage"></div>
<div id="runway"></div>
<div id="copy-root"></div>
<nav id="rail" aria-label="여정"></nav>

<div id="hint"><span>스크롤해서 날아가기</span><span class="line"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   HYPER CLOUD · scroll-world
   scroll-world 스킬(oso95/scroll-world)의 구조를 따르되,
   Higgsfield 사전 렌더 영상 대신 Three.js 실시간 카메라 비행으로
   동일한 "컷 없는 원테이크" 연출을 구현.
   sections 스키마는 스킬의 index-template.html과 동일 —
   추후 still/clip 필드를 채워 스크럽 엔진으로 교체 가능.
   ============================================================ */

const CONFIG = {
  brand: 'HYPER CLOUD',
  scrollPerScene: 1.55,           // 씬당 스크롤 길이 (vh 배수)
  sections: [
    { id:'studio', label:'스튜디오', accent:'#ffb84d',
      eyebrow:'HYPER CLOUD · AR / XR STUDIO',
      title:'아이디어가\n세계가 되는 곳',
      body:'브랜드와 공간, 이야기를 하나의 인터랙티브 세계로 빚어냅니다. 지금 보고 있는 이 비행처럼요.',
      tags:['AR·XR 에이전시','Seoul'] },
    { id:'production', label:'3D 프로덕션', accent:'#7ee0c3',
      eyebrow:'3D Production',
      title:'모델링부터\n애니메이션까지',
      body:'Blender 기반 파이프라인으로 캐릭터·제품·공간을 실시간 렌더링에 최적화해 제작합니다.',
      tags:['Blender','Rigging','NLA'] },
    { id:'ar', label:'모바일 AR', accent:'#ff8fa3',
      eyebrow:'Mobile AR',
      title:'화면 밖으로\n걸어 나오는 콘텐츠',
      body:'앱 설치 없이 브라우저에서 바로 열리는 웹 AR — 커머스와 캠페인을 현실 공간으로 확장합니다.',
      tags:['WebAR','Commerce','Campaign'] },
    { id:'xr', label:'전시 XR', accent:'#b39dff',
      eyebrow:'Exhibition XR',
      title:'공간 전체가\n캔버스가 됩니다',
      body:'뮤지엄과 전시장에서 AR 글래스로 과거와 현재를 한 시야에 겹쳐 보여줍니다.',
      tags:['AR Glasses','Museum','Installation'] },
    { id:'web', label:'웹 배포', accent:'#6ec9ff',
      eyebrow:'Web 3D Delivery',
      title:'링크 하나로\n전 세계에',
      body:'GLB와 Three.js로, 어떤 기기에서도 가볍게 열리는 3D 웹을 배포합니다.',
      tags:['Three.js','GLB','Optimization'] },
    { id:'contact', label:'Contact', accent:'#ffd166',
      eyebrow:'다음 세계의 주인공은',
      title:'당신의\n브랜드입니다',
      body:'스크롤 한 번으로 날아 들어올 수 있는 세계 — 함께 만들어요.',
      tags:[],
      cta:{ primary:{label:'프로젝트 문의하기', href:'mailto:hello@hyper-cloud.example'},
            secondary:{label:'포트폴리오 보기', href:'#'} } },
  ],
};

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = CONFIG.sections.length;

/* ── DOM: copy blocks + rail + runway ───────────────────── */
const copyRoot = document.getElementById('copy-root');
CONFIG.sections.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'copy'; el.id = s.id;
  el.style.setProperty('--acc', s.accent);
  el.innerHTML = `
    <div class="eyebrow">${s.eyebrow}</div>
    <h2>${s.title.replace(/\n/g,'<br>')}</h2>
    <p>${s.body}</p>
    ${s.tags.length? `<div class="tags">${s.tags.map(t=>`<span>${t}</span>`).join('')}</div>`:''}
    ${s.cta? `<div class="cta-row">
        <a class="btn primary" href="${s.cta.primary.href}">${s.cta.primary.label}</a>
        <a class="btn ghost" href="${s.cta.secondary.href}">${s.cta.secondary.label}</a>
      </div>`:''}
  `;
  copyRoot.appendChild(el);
});
const copyEls = [...document.querySelectorAll('.copy')];

const rail = document.getElementById('rail');
CONFIG.sections.forEach((s,i)=>{
  const b = document.createElement('button');
  b.style.setProperty('--acc', s.accent);
  b.innerHTML = `<span class="lbl">${s.label}</span><span class="dot"></span>`;
  b.addEventListener('click', ()=> {
    focusCameraOn(i);
    const max = document.documentElement.scrollHeight - innerHeight;
    scrollTo({ top: ((i + 0.5)/N) * max, behavior:'smooth' });
  });
  rail.appendChild(b);
});
const railBtns = [...rail.children];

const runway = document.getElementById('runway');
function sizeRunway(){
  runway.style.height = (N * CONFIG.scrollPerScene * 100) + 'vh';
}
sizeRunway();

if (reduced) {
  // 정적 폴백: 카피만 순서대로 노출
  copyEls.forEach(el=>el.classList.add('on'));
} else {

/* ── Three.js world ─────────────────────────────────────── */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x131026, 26, 95);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, .1, 300);

/* lights — 따뜻한 키 + 황혼 하늘 */
scene.add(new THREE.HemisphereLight(0x4a3f8f, 0xffb27a, 0.85));
const key = new THREE.DirectionalLight(0xffdcae, 1.1);
key.position.set(14, 26, 10);
scene.add(key);
const rim = new THREE.DirectionalLight(0x7a6cff, 0.5);
rim.position.set(-16, 10, -20);
scene.add(rim);

/* helpers */
const mat = (c, opts={}) => new THREE.MeshStandardMaterial({ color:c, roughness:.85, metalness:.05, flatShading:true, ...opts });
function rng(seed){ let s=seed; return ()=> (s = (s*16807)%2147483647)/2147483647; }

/* 떠 있는 클레이 디오라마 섬 */
function makeIsland(accent, seed){
  const g = new THREE.Group();
  const r = rng(seed);
  // 바위 하단 (뒤집힌 콘)
  const rock = new THREE.Mesh(new THREE.ConeGeometry(6.2, 7.5, 7, 2), mat(0x40376b));
  rock.rotation.x = Math.PI; rock.position.y = -3.9;
  rock.geometry.vertices?.forEach(()=>{}); // r128 BufferGeometry — noop
  g.add(rock);
  // 상판
  const top = new THREE.Mesh(new THREE.CylinderGeometry(6.2, 6.2, 1.1, 7), mat(0x59519c));
  top.position.y = -0.3;
  g.add(top);
  const grass = new THREE.Mesh(new THREE.CylinderGeometry(6.05, 6.2, .35, 7), mat(accent, {roughness:.95}));
  grass.position.y = .35;
  grass.material.color.lerp(new THREE.Color(0xffffff), .25);
  g.add(grass);
  // 잔돌
  for(let i=0;i<4;i++){
    const s = .3 + r()*.5;
    const peb = new THREE.Mesh(new THREE.DodecahedronGeometry(s,0), mat(0x8f86c9));
    const a = r()*Math.PI*2, d = 3.6 + r()*2;
    peb.position.set(Math.cos(a)*d, .55+s*.4, Math.sin(a)*d);
    peb.rotation.set(r()*3, r()*3, r()*3);
    g.add(peb);
  }
  return g;
}

/* 씬별 소품 */
function propStudio(acc){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.4,2.4,3), mat(0xf2e6d8));
  body.position.y = 1.7; g.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.9,1.7,4), mat(acc));
  roof.position.y = 3.75; roof.rotation.y = Math.PI/4; g.add(roof);
  const win = new THREE.Mesh(new THREE.BoxGeometry(1.1,1.1,.1), mat(0xfff3c9,{emissive:0xffc86b,emissiveIntensity:.9}));
  win.position.set(0,1.8,1.56); g.add(win);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,3.2), mat(0xc9c2e6));
  pole.position.set(2.9,2.1,-1); g.add(pole);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(.5,10,8), mat(acc,{emissive:acc,emissiveIntensity:1.2}));
  bulb.position.set(2.9,3.9,-1); g.add(bulb);
  g.userData.spin = bulb;
  return g;
}
function propProduction(acc){
  const g = new THREE.Group();
  const ped = new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.9,.8,6), mat(0xd9d2f0));
  ped.position.y = .9; g.add(ped);
  const model = new THREE.Mesh(new THREE.IcosahedronGeometry(1.7,0), mat(acc));
  model.position.y = 3.1; g.add(model);
  const wire = new THREE.Mesh(new THREE.IcosahedronGeometry(1.85,0),
    new THREE.MeshBasicMaterial({color:0xffffff, wireframe:true, transparent:true, opacity:.35}));
  wire.position.y = 3.1; g.add(wire);
  // 기즈모 축
  const axes = [[0xff5566,[1,0,0]],[0x66dd88,[0,1,0]],[0x5588ff,[0,0,1]]];
  axes.forEach(([c,d])=>{
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,2.6), mat(c,{emissive:c,emissiveIntensity:.5}));
    bar.position.y = 3.1;
    if(d[0]) bar.rotation.z = Math.PI/2;
    if(d[2]) bar.rotation.x = Math.PI/2;
    g.add(bar);
  });
  g.userData.spin = model; g.userData.spin2 = wire;
  return g;
}
function propAR(acc){
  const g = new THREE.Group();
  const phone = new THREE.Mesh(new THREE.BoxGeometry(2.6,4.8,.3), mat(0x2a2350,{roughness:.4}));
  phone.position.y = 2.9; phone.rotation.y = -.25; g.add(phone);
  const screen = new THREE.Mesh(new THREE.BoxGeometry(2.25,4.4,.06), mat(0x120f28,{emissive:0x4a3fa0,emissiveIntensity:.5}));
  screen.position.set(0,2.9,.19); screen.rotation.y = -.25; g.add(screen);
  const pop = new THREE.Mesh(new THREE.DodecahedronGeometry(.85,0), mat(acc,{emissive:acc,emissiveIntensity:.7}));
  pop.position.set(.9,3.4,1.5); g.add(pop);
  for(let i=0;i<3;i++){
    const sp = new THREE.Mesh(new THREE.OctahedronGeometry(.18,0), mat(0xfff0b0,{emissive:0xffe08a,emissiveIntensity:1}));
    sp.position.set(.2+i*.8, 4.4+ (i%2)*.5, 1.1+i*.3);
    g.add(sp);
  }
  g.userData.spin = pop;
  return g;
}
function propXR(acc){
  const g = new THREE.Group();
  for(let i=0;i<4;i++){
    const col = new THREE.Mesh(new THREE.CylinderGeometry(.35,.42,3.4,8), mat(0xe9e2f6));
    col.position.set(i<2?-1.9:1.9, 2, i%2?-1.4:1.4);
    g.add(col);
  }
  const roof = new THREE.Mesh(new THREE.BoxGeometry(5.4,.55,4.2), mat(acc));
  roof.position.y = 4; g.add(roof);
  const ped2 = new THREE.Mesh(new THREE.BoxGeometry(1.2,1,1.2), mat(0xcfc6ec));
  ped2.position.y = .9; g.add(ped2);
  // AR 글래스: 링 두 개 + 브릿지
  const glass = new THREE.Group();
  const lm = mat(0x9fe8ff,{emissive:0x66ccff,emissiveIntensity:.8, roughness:.3});
  const l1 = new THREE.Mesh(new THREE.TorusGeometry(.42,.09,8,18), lm); l1.position.x=-.5;
  const l2 = l1.clone(); l2.position.x=.5;
  const br = new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.5), lm);
  br.rotation.z = Math.PI/2;
  glass.add(l1,l2,br); glass.position.y = 2.4;
  g.add(glass);
  g.userData.float = glass;
  return g;
}
function propWeb(acc){
  const g = new THREE.Group();
  const globe = new THREE.Mesh(new THREE.IcosahedronGeometry(1.9,1), mat(acc,{roughness:.6}));
  globe.position.y = 3; g.add(globe);
  const net = new THREE.Mesh(new THREE.IcosahedronGeometry(2.02,1),
    new THREE.MeshBasicMaterial({color:0xffffff, wireframe:true, transparent:true, opacity:.28}));
  net.position.y = 3; g.add(net);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(3,.09,8,40), mat(0xffe08a,{emissive:0xffcf6b,emissiveIntensity:.6}));
  ring.position.y = 3; ring.rotation.x = 1.15; g.add(ring);
  const sat = new THREE.Mesh(new THREE.BoxGeometry(.4,.4,.4), mat(0xffffff));
  g.add(sat);
  g.userData.spin = globe; g.userData.spin2 = net; g.userData.orbit = sat; g.userData.ring = ring;
  return g;
}
function propContact(acc){
  const g = new THREE.Group();
  const cloud = new THREE.Group();
  const cm = mat(0xf6f1ff,{roughness:.95});
  [[0,0,0,1.6],[1.4,-.2,.3,1.15],[-1.4,-.15,-.2,1.2],[.5,.6,-.5,1],[-0.6,.55,.5,.95]].forEach(([x,y,z,s])=>{
    const b = new THREE.Mesh(new THREE.SphereGeometry(s,10,8), cm);
    b.position.set(x,y,z); cloud.add(b);
  });
  cloud.position.y = 2.8; g.add(cloud);
  const star = new THREE.Mesh(new THREE.OctahedronGeometry(.75,0), mat(acc,{emissive:acc,emissiveIntensity:1.4}));
  star.position.y = 5.4; g.add(star);
  const glow = new THREE.PointLight(new THREE.Color(acc), 1.4, 18);
  glow.position.y = 5.4; g.add(glow);
  g.userData.spin = star; g.userData.float = cloud;
  return g;
}

/* 섬 배치 — 굽이치는 항로 */
const islandPos = [
  new THREE.Vector3(  0, 0,    0),
  new THREE.Vector3( 19, 2,  -27),
  new THREE.Vector3( -9, 4,  -54),
  new THREE.Vector3( 17, 6,  -82),
  new THREE.Vector3(-13, 8, -110),
  new THREE.Vector3(  2, 11, -138),
];
const propFns = [propStudio, propProduction, propAR, propXR, propWeb, propContact];
const islands = CONFIG.sections.map((s,i)=>{
  const isl = makeIsland(new THREE.Color(s.accent), 1000+i*77);
  const prop = propFns[i](new THREE.Color(s.accent));
  prop.position.y = .5;
  isl.add(prop);
  isl.position.copy(islandPos[i]);
  isl.userData.prop = prop;
  isl.userData.baseY = islandPos[i].y;
  isl.userData.phase = i * 1.3;
  scene.add(isl);
  return isl;
});

/* 별 파티클 */
{
  const geo = new THREE.BufferGeometry();
  const n = 500, pos = new Float32Array(n*3), r = rng(42);
  for(let i=0;i<n;i++){
    pos[i*3]   = (r()-.5)*220;
    pos[i*3+1] = r()*70 - 8;
    pos[i*3+2] = -r()*200 + 20;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({color:0xcfc6ff, size:.35, transparent:true, opacity:.7})));
}

/* ── 카메라 항로: far→near 포인트를 Catmull-Rom으로 연결 = 원테이크 */
const up = new THREE.Vector3(0,1,0);
const pathPts = [], lookPts = [], focusCamPts = [], focusLookPts = [];
islandPos.forEach((P,i)=>{
  const prev = islandPos[i-1] || P.clone().add(new THREE.Vector3(0,4,26));
  const dirIn = P.clone().sub(prev).normalize();
  const far  = P.clone().sub(dirIn.clone().multiplyScalar(15)).add(up.clone().multiplyScalar(7.5));
  const near = P.clone().sub(dirIn.clone().multiplyScalar(4.5)).add(up.clone().multiplyScalar(2.6));
  pathPts.push(far, near);
  const focusTarget = P.clone().add(up.clone().multiplyScalar(2.35));
  lookPts.push(P.clone().add(up.clone().multiplyScalar(2.6)),
               focusTarget.clone());
  focusCamPts.push(near.clone());
  focusLookPts.push(focusTarget);
});
// 마지막 씬은 안쪽으로 조금 더 들어가며 마무리
pathPts.push(islandPos[N-1].clone().add(new THREE.Vector3(0,2.2,-3.5)));
lookPts.push(islandPos[N-1].clone().add(new THREE.Vector3(0,3.4,-8)));

const camPath  = new THREE.CatmullRomCurve3(pathPts, false, 'centripetal');
const lookPath = new THREE.CatmullRomCurve3(lookPts, false, 'centripetal');

/* Rail-button focus: fly to an exact camera frame that looks at the selected model. */
const focusState = {
  active:false,
  startedAt:0,
  duration:900,
  startPos:new THREE.Vector3(),
  endPos:new THREE.Vector3(),
  startQuat:new THREE.Quaternion(),
  endQuat:new THREE.Quaternion(),
};
function focusCameraOn(index){
  focusState.active = true;
  focusState.startedAt = performance.now();
  focusState.startPos.copy(camera.position);
  focusState.startQuat.copy(camera.quaternion);
  focusState.endPos.copy(focusCamPts[index]);
  const m = new THREE.Matrix4().lookAt(focusState.endPos, focusLookPts[index], up);
  focusState.endQuat.setFromRotationMatrix(m);
}
function releaseCameraFocus(){ focusState.active = false; }
addEventListener('wheel', releaseCameraFocus, {passive:true});
addEventListener('touchstart', releaseCameraFocus, {passive:true});
addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].includes(e.key)) releaseCameraFocus();
});

/* ── scroll → t ─────────────────────────────────────────── */
let goalT = 0, curT = 0;
function readScroll(){
  const max = document.documentElement.scrollHeight - innerHeight;
  goalT = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
}
addEventListener('scroll', readScroll, {passive:true});
readScroll();

/* copy + rail + 테마 상태 */
const hint = document.getElementById('hint');
const brandEm = document.querySelector('.brand em');
function smooth(a,b,x){ const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); }

function updateUI(t){
  const sp = t * N;                      // 0..N
  let active = Math.min(N-1, Math.floor(sp + .42));
  copyEls.forEach((el,i)=>{
    const local = sp - i;                // 이 씬 기준 위치
    let o;
    if (i === 0)      o = 1 - smooth(.55, .95, local);           // 히어로는 착지 즉시 노출
    else if (i === N-1) o = smooth(.30, .60, local);              // 피날레는 끝까지 유지
    else o = smooth(.30, .58, local) * (1 - smooth(.78, 1.02, local));
    el.style.opacity = o.toFixed(3);
    el.style.transform = `translateY(${(1-o)*18}px)`;
    el.classList.toggle('on', o > .5);
  });
  railBtns.forEach((b,i)=> b.classList.toggle('active', i === active));
  const acc = CONFIG.sections[active].accent;
  document.documentElement.style.setProperty('--sw-accent', acc);
  brandEm.style.color = acc;
  hint.style.opacity = t < .015 ? 1 : 0;
}

/* ── resize (모바일 URL바 높이 변화 무시) ───────────────── */
let lastW = innerWidth;
const isTouch = matchMedia('(pointer: coarse)').matches;
addEventListener('resize', ()=>{
  if (isTouch && innerWidth === lastW) { readScroll(); return; } // height-only → 점프 방지
  lastW = innerWidth;
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  readScroll();
});

/* ── render loop ────────────────────────────────────────── */
const clock = new THREE.Clock();
function tick(){
  const dt = Math.min(clock.getDelta(), .05);
  const time = clock.elapsedTime;

  curT += (goalT - curT) * Math.min(1, dt*4.2);
  const t = Math.min(.9999, Math.max(0, curT));

  camera.position.copy(camPath.getPointAt(t));
  const look = lookPath.getPointAt(t);
  // 진행 방향을 살짝 섞어 비행감 유지
  const ahead = camPath.getPointAt(Math.min(.9999, t + .012));
  look.lerp(ahead, .18);
  camera.lookAt(look);
  camera.position.y += Math.sin(time*1.1)*.06; // 미세한 부유감

  if(focusState.active){
    const p = Math.min(1, (performance.now() - focusState.startedAt) / focusState.duration);
    const eased = p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;
    camera.position.lerpVectors(focusState.startPos, focusState.endPos, eased);
    camera.quaternion.slerpQuaternions(focusState.startQuat, focusState.endQuat, eased);
  }

  islands.forEach((isl,i)=>{
    isl.position.y = isl.userData.baseY + Math.sin(time*.7 + isl.userData.phase)*.35;
    const p = isl.userData.prop.userData;
    if(p.spin)  p.spin.rotation.y  += dt*.7;
    if(p.spin2) p.spin2.rotation.y -= dt*.4;
    if(p.float) p.float.position.y = 2.4 + Math.sin(time*1.3 + i)*.18;
    if(p.orbit){
      p.orbit.position.set(Math.cos(time*.9)*3, 3 + Math.sin(time*.9)*1.1, islandsSatZ(time));
    }
  });
  function islandsSatZ(tm){ return Math.sin(tm*.9)*2.6; }

  updateUI(t);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

} // reduced-motion else 끝
</script>
